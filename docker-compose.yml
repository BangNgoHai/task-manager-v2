services:
  backend:
    build: ./backend
    container_name: task-manager-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    volumes:
      - task-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: task-manager-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  task-data:
